name: Publish verified release subset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
      source_run_id:
        description: Successful Release workflow run containing the verified artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate source run and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          test "$(jq -r .workflow_id <<<"$run")" = "393031871"
          test "$(jq -r .head_branch <<<"$run")" = "$TAG"
          test "$(jq -r .head_sha <<<"$run")" = "$(git rev-parse "${TAG}^{commit}")"
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts")
          for name in Concat-linux-x86_64 Concat-linux-aarch64 Concat-windows-x86_64 Concat-macos-x86_64 Concat-android-arm64 Concat-ios-arm64; do
            jq -e --arg name "$name" '.artifacts[] | select(.name == $name and .expired == false)' <<<"$artifacts" >/dev/null
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: Concat-*
          path: bundles
          merge-multiple: true

      - name: Create partial manifest, checksums, and notes
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNED: "false"
          ANDROID_STARTED: "true"
        run: |
          set -euo pipefail
          version=${TAG#v}
          rm -f "bundles/Concat-${version}-pwa.zip"
          test -n "$(find bundles -maxdepth 1 -type f -name 'Concat-*' -print -quit)"
          python3 scripts/models.py release-manifest --version "$version" --tag "$TAG" --bundles bundles --out bundles/manifest.json
          (cd bundles && sha256sum -- * > SHA256SUMS)
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          .github/release-notes.sh "$previous" "$TAG" "$version" > "$RUNNER_TEMP/notes-generated.md"
          awk '/^### Download/{exit} {print}' "$RUNNER_TEMP/notes-generated.md" > "$RUNNER_TEMP/notes.md"
          {
            echo "# ClipCut Studio $version — verified installers"
            echo
            echo "This release contains packages that completed build and launch checks: Linux x86_64 and ARM64, Windows x86_64, macOS Intel, Android ARM64, and iOS ARM64."
            echo
            echo "The macOS Apple Silicon package is not included in this release; it will be attached after it completes the same checks."
            echo
            echo "The Windows installer is unsigned. The iOS IPA is ad-hoc signed and needs signing for the installing device."
            echo
            echo "## Available packages"
            echo
            echo "- Linux x86_64 and ARM64"
            echo "- Windows x86_64"
            echo "- macOS Intel x86_64"
            echo "- Android ARM64"
            echo "- iOS ARM64"
            echo
            echo '`SHA256SUMS` lists the checksum for each file. `manifest.json` contains the packages included in this release.'
            echo
            echo "## Changes"
            cat "$RUNNER_TEMP/notes-generated.md"
          } >> "$RUNNER_TEMP/notes.md"
          ls -lh bundles

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag }}
          name: ClipCut Studio ${{ inputs.tag }}
          draft: false
          prerelease: false
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: true
          files: bundles/*
